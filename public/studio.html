<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Студия · Волейбол</title>
  <link rel="stylesheet" href="studio/studio.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js" } }</script>
</head>
<body class="studio">
  <!-- Иконки: один SVG-спрайт, дальше <svg><use href="#i-…"></svg> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1" fill="currentColor"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/><text x="12" y="15.5" font-size="7" font-weight="700" text-anchor="middle" fill="currentColor" font-family="Inter,sans-serif">5</text></symbol>
      <symbol id="i-fwd" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/><text x="12" y="15.5" font-size="7" font-weight="700" text-anchor="middle" fill="currentColor" font-family="Inter,sans-serif">5</text></symbol>
      <symbol id="i-back15" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/><text x="12.4" y="15.3" font-size="6.6" font-weight="700" text-anchor="middle" fill="currentColor" font-family="Inter,sans-serif">15</text></symbol>
      <symbol id="i-fwd15" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/><text x="11.6" y="15.3" font-size="6.6" font-weight="700" text-anchor="middle" fill="currentColor" font-family="Inter,sans-serif">15</text></symbol>
      <symbol id="i-zoom" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m15 15 5 5M8 10.5h5M10.5 8v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-fback" viewBox="0 0 24 24"><path fill="currentColor" d="M6 5h2v14H6zM19 6.2v11.6a.8.8 0 0 1-1.25.66L10 13.2a1 1 0 0 1 0-1.6l7.75-5.26A.8.8 0 0 1 19 6.2Z"/></symbol>
      <symbol id="i-ffwd" viewBox="0 0 24 24"><path fill="currentColor" d="M16 5h2v14h-2zM5 6.2v11.6a.8.8 0 0 0 1.25.66L14 13.2a1 1 0 0 0 0-1.6L6.25 6.34A.8.8 0 0 0 5 6.2Z"/></symbol>
      <symbol id="i-split" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 5v14" stroke="currentColor" stroke-width="1.8"/></symbol>
      <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 5v14M17 5v14M3 9.5h4M3 14.5h4M17 9.5h4M17 14.5h4" stroke="currentColor" stroke-width="1.5"/></symbol>
      <symbol id="i-cube" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Zm0 0v0M4 7.5 12 12l8-4.5M12 12v9"/></symbol>
      <symbol id="i-top" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M6 12h12M6 9h12M6 15h12" stroke="currentColor" stroke-width="1" opacity=".6"/></symbol>
      <symbol id="i-side" viewBox="0 0 24 24"><path d="M2 18h20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 18V9" stroke="currentColor" stroke-width="1.8"/><path d="M12 9h0" stroke="currentColor"/><path d="M5 14c2-6 5-8 7-8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 2"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3" fill="currentColor"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" d="M4 4h16v16H4zM9.33 4v16M14.67 4v16M4 9.33h16M4 14.67h16"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 14 4 9l5-5"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 15V4m0 0L7.5 8.5M12 4l4.5 4.5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.8a3.5 3.5 0 0 1 0 6.4M18.5 14.8c1.7.8 2.7 2.5 3 5.2"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
      <symbol id="i-swap" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></symbol>
      <symbol id="i-clip" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="currentColor" d="m17 10 4-2.5v9L17 14z"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0C18.5 15.4 12 21 12 21Z"/><circle cx="12" cy="10" r="2.3" fill="currentColor"/></symbol>
      <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10.5 18.5h3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-insert" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 6h16M4 18h16M12 9v6M9 12h6"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
      <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 10h.01M9 10h.01M12 10h.01M15 10h.01M18 10h.01M8 14h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <!-- Навыки -->
      <symbol id="s-serve" viewBox="0 0 24 24"><circle cx="15" cy="7" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M4 20c2-5 5-8 9-9.5"/></symbol>
      <symbol id="s-rec" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M5 17l7-4 7 4M12 13V8"/><circle cx="12" cy="5.5" r="2.5" fill="currentColor"/></symbol>
      <symbol id="s-set" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M4 19C7 7 15 4 20 8"/><circle cx="20" cy="8" r="2" fill="currentColor"/><path d="M4 19h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
      <symbol id="s-att" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M5 4l14 14M19 11v7h-7"/></symbol>
      <symbol id="s-blk" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M7 20V9.5a1.5 1.5 0 0 1 3 0V5.5a1.5 1.5 0 0 1 3 0v4a1.5 1.5 0 0 1 3 0V20"/><path d="M3 20h18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
      <symbol id="s-dig" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M3 20h18M6 16c3-1.5 9-1.5 12 0"/><circle cx="12" cy="9" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
      <symbol id="s-fault" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M12 3.5 21 19.5H3Z"/><path d="M12 10v4.5M12 17h.01" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    </defs>
  </svg>

  <div class="app" id="app">
    <header class="topbar">
      <a class="brand" href="/" title="На главную"><span class="logo"></span><b>Студия</b></a>
      <button class="match-pick" id="matchPick" data-a="tab" data-tab="match"></button>
      <div class="scoreboard" id="score"></div>
      <div class="phase-pill" id="phase"></div>
      <div class="top-actions">
        <button class="ibtn" data-a="help" title="Горячие клавиши (?)"><svg><use href="#i-keyboard"/></svg></button>
        <a class="ibtn" href="detailed.html" title="Пульт для телефона"><svg><use href="#i-phone"/></svg></a>
        <a class="btn-chip" href="stats.html" target="_blank"><svg><use href="#i-chart"/></svg>Дашборд</a>
      </div>
    </header>

    <section class="stage">
      <div class="viewport" id="viewport" data-layout="split">
        <div class="pane video-pane">
          <div class="vstage" id="vstage"><video id="video" preload="auto" playsinline></video></div>
          <canvas class="minimap" id="minimap" width="192" height="108" title="Кликните, чтобы переместить зум"></canvas>
          <div class="video-empty" id="videoEmpty">
            <svg><use href="#i-film"/></svg>
            <b>Видео не выбрано</b>
            <span>Перетащите файл матча в окно — он скопируется в библиотеку программы.<br>Без видео тоже можно вести статистику.</span>
            <button class="btn" data-a="pickFile"><svg><use href="#i-upload"/></svg>Выбрать файл</button>
          </div>
          <div class="video-hud" id="videoHud"></div>
        </div>
        <div class="splitter" id="splitter" title="Потяните, чтобы изменить размер"></div>
        <div class="pane court-pane">
          <div id="court3d" class="court3d"></div>
          <div class="court-tools">
            <button class="ibtn on" data-a="view" data-v="persp" title="Перспектива"><svg><use href="#i-cube"/></svg></button>
            <button class="ibtn" data-a="view" data-v="top" title="Сверху"><svg><use href="#i-top"/></svg></button>
            <button class="ibtn" data-a="view" data-v="behind" title="Из-за спины"><svg><use href="#i-eye"/></svg></button>
            <button class="ibtn" data-a="view" data-v="side" title="Сбоку"><svg><use href="#i-side"/></svg></button>
            <span class="sep"></span>
            <button class="ibtn on" data-a="zones" title="Сетка зон"><svg><use href="#i-grid"/></svg></button>
            <button class="ibtn" data-a="zonesEditor" title="Зоны доводки (++ / +− / +)"><svg><use href="#i-pin"/></svg></button>
          </div>
          <div class="court-hint" id="courtHint"></div>
          <div class="court-menu" id="courtMenu"></div>
          <div class="court-hover" id="courtHover"></div>
        </div>
      </div>
      <div class="transport" id="transport">
        <button class="ibtn" data-a="seek" data-d="-15" title="Назад 15 с (Shift+←)"><svg><use href="#i-back15"/></svg></button>
        <button class="ibtn" data-a="seek" data-d="-5" title="Назад 5 с (←)"><svg><use href="#i-back"/></svg></button>
        <button class="ibtn" data-a="frame" data-d="-1" title="Кадр назад (,)"><svg><use href="#i-fback"/></svg></button>
        <button class="ibtn play" data-a="play" id="playBtn" title="Пуск / пауза (пробел)"><svg><use href="#i-play"/></svg></button>
        <button class="ibtn" data-a="frame" data-d="1" title="Кадр вперёд (.)"><svg><use href="#i-ffwd"/></svg></button>
        <button class="ibtn" data-a="seek" data-d="5" title="Вперёд 5 с (→)"><svg><use href="#i-fwd"/></svg></button>
        <button class="ibtn" data-a="seek" data-d="15" title="Вперёд 15 с (Shift+→)"><svg><use href="#i-fwd15"/></svg></button>
        <span class="tc" id="tc">0:00.0 / 0:00</span>
        <div class="seg" id="speed">
          <button data-a="speed" data-v="0.5">0.5×</button><button data-a="speed" data-v="1" class="on">1×</button><button data-a="speed" data-v="1.5">1.5×</button><button data-a="speed" data-v="2">2×</button>
        </div>
        <div class="zoomctl" id="zoomCtl" title="Зум видео: колесо мыши над видео, перетаскивание — сдвиг, двойной клик — сброс">
          <button class="ibtn" data-a="vzoom" data-d="-1">−</button><span id="zoomVal">100%</span><button class="ibtn" data-a="vzoom" data-d="1">+</button>
        </div>
        <label class="toggle" title="Пауза, пока вводите касание; после ввода видео продолжится само"><input type="checkbox" id="autoPause" checked><span>Пауза при вводе</span></label>
        <span class="grow"></span>
        <div class="seg" id="layout">
          <button data-a="layout" data-v="video" title="Только видео"><svg><use href="#i-film"/></svg></button>
          <button data-a="layout" data-v="split" class="on" title="Видео и площадка"><svg><use href="#i-split"/></svg></button>
          <button data-a="layout" data-v="court" title="Только площадка"><svg><use href="#i-cube"/></svg></button>
        </div>
      </div>
      <div class="timeline" id="timeline"><div class="tl-track" id="tlTrack"></div><div class="tl-head" id="tlHead"></div></div>
    </section>

    <section class="dock" id="dock"></section>

    <aside class="side">
      <nav class="side-tabs" id="sideTabs">
        <button data-a="tab" data-tab="events" class="on"><svg><use href="#i-list"/></svg>События</button>
        <button data-a="tab" data-tab="video"><svg><use href="#i-film"/></svg>Видео</button>
        <button data-a="tab" data-tab="match"><svg><use href="#i-users"/></svg>Матч</button>
      </nav>
      <div class="side-body" id="side"></div>
    </aside>
  </div>

  <div class="drop-veil" id="dropVeil"><div><svg><use href="#i-upload"/></svg><b>Отпустите, чтобы добавить видео</b><span>Файл скопируется в папку программы data/videos</span></div></div>
  <div id="modal"></div>
  <div class="toast" id="toast"></div>
  <input type="file" id="fileInput" accept="video/*,.mkv,.mov" multiple hidden>

  <script type="module" src="studio/studio.js"></script>
</body>
</html>
