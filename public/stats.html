<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Статистика матча</title>
  <link rel="stylesheet" href="app.css">
  <style>
    /* Детальный дашборд: таблица с группами колонок. Цвета и шрифты — из app.css */
    .detailed #app { max-width: 1200px; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
    th, td { padding: 8px 9px; border-bottom: 1px solid rgb(255 255 255 / 0.05); text-align: center; white-space: nowrap; }
    th { color: var(--muted); font-weight: 500; font-size: 12px; }
    th.grp { border-bottom: 0; color: var(--text); font-size: 13px; border-left: 1px solid var(--line); }
    td.l, th.l { text-align: left; }
    /* Закреплённый столбец с игроком: при прокрутке таблицы вправо имя остаётся на месте */
    tr > :first-child { position: sticky; left: 0; z-index: 1; background: var(--card); box-shadow: 1px 0 0 0 rgb(255 255 255 / 0.06); }
    td.b { border-left: 1px solid var(--line); }
    tr.total td { font-weight: 600; border-top: 1px solid var(--line); }
    .wrap { overflow-x: auto; background: var(--card); border-radius: 16px; padding: 4px 0; box-shadow: var(--shadow-key); }
    select { font: inherit; font-size: 14px; color: var(--text); background: var(--color-raise); border: 0; border-radius: 8px; padding: 10px 12px; box-shadow: var(--shadow-key); }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
    .tabs button { min-height: 36px; padding: 6px 14px; font-size: 13px; }
    .kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
    .kpi .card { margin: 0; padding: 18px; }
    .kpi .v { font-size: 34px; font-weight: 400; line-height: 1.1; margin-top: 6px; }
    .kpi .s { color: var(--color-smoke); font-size: 13px; margin-top: 4px; }
  </style>
</head>
<body class="detailed min-h-dvh">
  <main id="app"></main>
  <script type="module" src="stats.js"></script>
</body>
</html>
