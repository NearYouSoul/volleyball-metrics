<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Волей Метрика">
  <!-- Знак приложения: мяч, через который проходит линия графика (данные) с коралловой точкой. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1d22"/><stop offset="1" stop-color="#0c0d10"/></linearGradient>
    <linearGradient id="ln" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ff6363" stop-opacity=".35"/><stop offset="1" stop-color="#ff6363"/></linearGradient>
    <clipPath id="ball"><circle cx="32" cy="32" r="18.5"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="1.5"/>
  <g clip-path="url(#ball)" fill="none" stroke="#e9eaec" stroke-width="2.5" stroke-linecap="round">
    <!-- Три панели волейбольного мяча расходятся из центра -->
    <path d="M32 32c0-8 4.5-14.5 12-18"/>
    <path d="M32 32c-7 3.6-14.6 3.4-19.6-1.6"/>
    <path d="M32 32c6.6 4.2 9.4 11.2 7.6 18.6"/>
    <path d="M25.6 15.6c3.4 5.6 4 12 1.2 18.4"/>
    <path d="M16.6 43c6.2-2.2 12.8-1.2 17.8 3.4"/>
    <path d="M49.6 36.4c-3.4-6.2-9.2-9.4-16-8.8"/>
  </g>
  <circle cx="32" cy="32" r="18.5" fill="none" stroke="#e9eaec" stroke-width="3"/>
  <path d="M8 45.5 20 38l9 4.2 11-11.5 9.5 3.6L57 23" fill="none" stroke="url(#ln)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="57" cy="23" r="3.6" fill="#ff6363"/>
  <circle cx="57" cy="23" r="6.5" fill="#ff6363" fill-opacity=".18"/>
</svg>
